[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ffrich"
dynamic = ["version"]
description = "A simple progress bar for ffmpeg, written in Python using rich"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "banksio", email = "nathantb3@gmail.com"}
]
keywords = ["ffmpeg", "ffmpeg-command", "progress-bar", "python-script", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: Unix",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Video :: Conversion"
]
dependencies = [
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/banksio/ffrich"
"Bug Tracker" = "https://github.com/banksio/ffrich/issues"
Changelog = "https://github.com/banksio/ffrich/blob/master/CHANGELOG.md"

[project.scripts]
ffrich = "ffrich:main"

[tool.setuptools]
py-modules = ["ffrich"]
zip-safe = true
include-package-data = false

[tool.setuptools_scm]
write_to = "ffrich/_version.py"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["D", "E", "F", "W"]
ignore = ["D100", "D200", "D203", "D213", "D406", "D407"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "@abc.abstractmethod",
  "@abc.abstractproperty",
  "raise NotImplementedError",
  "return NotImplemented"
]

[tool.green]
file-pattern = "test_*.py"
verbose = 2
no-skip-report = true
quiet-stdout = true
run-coverage = true
processes = 1

[tool.nosetests]
verbosity = 2
with-coverage = true
cover-xml = true
cover-package = "ffrich"
with-doctest = true
doctest-extension = ".rst"
rednose = true

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
